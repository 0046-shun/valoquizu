<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VALO QUIZ — クレジットクイズ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Teko:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="credit.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="grid-bg" aria-hidden="true"></div>

    <header class="top">
      <p class="brand">VALO<span>QUIZ</span></p>
      <nav class="tabs" aria-label="クイズ切り替え">
        <a class="tab" href="index.html">SKILL</a>
        <a class="tab is-active" href="credit.html" aria-current="page">CREDIT</a>
        <a class="tab" href="tournament.html">CUP</a>
      </nav>
      <p class="tag">この金額で全部買える？ ○ / ×</p>
    </header>

    <main class="stage">
      <section class="wallet" aria-label="所持クレジット">
        <span class="wallet__label">CREDITS</span>
        <span class="wallet__amount" id="credits">—</span>      </section>

      <section class="loadout" aria-label="購入リスト">
        <figure class="loadout__agent">
          <img id="agent-img" alt="" />
          <figcaption id="agent-name">—</figcaption>
        </figure>
        <ul class="loadout__items" id="items"></ul>
      </section>

      <section class="controls">
        <button type="button" class="spin-btn" id="next-btn">
          <span class="spin-btn__glitch">NEXT</span>
          <span class="spin-btn__sub">新しい問題</span>
        </button>
      </section>

      <section class="answer-panel">
        <button
          type="button"
          class="answer-btn"
          id="answer-btn"
          aria-expanded="false"
        >
          <span class="answer-btn__hint" id="answer-hint"
            >答えはクリックで開く</span
          >
          <span class="credit-answer" id="answer-value" hidden>
            <span class="credit-answer__verdict" id="verdict"></span>
            <span class="credit-answer__breakdown" id="breakdown"></span>
          </span>
        </button>
        <p class="howto">
          口頭で ○ / × を宣言 → クリックで正解確認。入力はありません。
        </p>
      </section>
    </main>

    <footer class="foot">
      <span
        >Agent art © Riot Games · sourced from
        <a
          href="https://playvalorant.com/ja-jp/agents/"
          target="_blank"
          rel="noopener"
          >playvalorant.com</a
        ></span
      >
    </footer>

    <script src="credit-data.js"></script>
    <script src="credit.js"></script>
  </body>
</html>
